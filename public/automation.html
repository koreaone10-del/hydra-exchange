<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أوتوميشن النقاط | HydraTube AI</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background: #050505; color: #fff; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        
        /* واجهة التحكم העلوية */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: rgba(15, 23, 42, 0.9); border-bottom: 1px solid rgba(255,255,255,0.1); z-index: 10; }
        .logo { font-size: 20px; font-weight: 900; background: linear-gradient(90deg, #38bdf8, #ef4444); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .stats { font-size: 14px; font-weight: bold; background: rgba(34, 197, 94, 0.2); padding: 5px 12px; border-radius: 8px; border: 1px solid #22c55e; color: #4ade80; }

        /* منطقة الفيديو */
        .video-container { flex: 1; position: relative; background: #000; display: flex; justify-content: center; align-items: center; }
        #ytplayer { width: 100%; height: 100%; max-width: 600px; /* ليتناسب مع شكل الشورتس */ pointer-events: none; /* يمنع المستخدم من التدخل */ }

        /* الواجهة العائمة (الأوتوميشن) - مثل التطبيق الذي رأيناه */
        .overlay-panel { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(10px); border: 1px solid rgba(56, 189, 248, 0.4); border-radius: 16px; padding: 15px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 20; }
        .status-text { color: #e2e8f0; font-size: 13px; font-family: monospace; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        .spinner { width: 12px; height: 12px; border: 2px solid #38bdf8; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* شريط التقدم */
        .progress-bar { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; margin-bottom: 10px; }
        .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #ef4444, #38bdf8); transition: width 1s linear; }

        /* أزرار التحكم */
        .controls { display: flex; justify-content: center; gap: 15px; }
        .btn-action { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 10px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 45px; height: 45px; transition: 0.3s; }
        .btn-action.play { background: #ef4444; border-color: #ef4444; }
        .btn-action:hover { transform: scale(1.1); }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">⚡ HydraTube AI</div>
        <div class="stats" id="userCredits">الرصيد: 0 نقطة</div>
    </div>

    <div class="video-container">
        <!-- طبقة شفافة لمنع النقر اليدوي وجعل التحكم فقط عبر الذكاء الاصطناعي -->
        <div style="position: absolute; top:0; left:0; width:100%; height:100%; z-index:5;"></div>
        <div id="ytplayer"></div>

        <!-- اللوحة العائمة -->
        <div class="overlay-panel">
            <div class="status-text" id="statusText">
                <div class="spinner"></div> @hydratube: جاري التحقق من الفيديو...
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="controls">
                <button class="btn-action play" onclick="startAutomation()" id="btnStart">▶</button>
                <button class="btn-action" onclick="skipVideo()">⏭</button>
            </div>
        </div>
    </div>

    <!-- استدعاء مكتبة يوتيوب -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let player;
        let isWorking = false;
        let watchTimer = null;
        let targetSeconds = 30; // مدة المشاهدة المطلوبة للحصول على النقاط
        let currentSeconds = 0;

        // قائمة فيديوهات تجريبية (يتم جلبها لاحقاً من قاعدة البيانات للفيديوهات المروج لها)
        let videosQueue = ['jfKfPfyJRdk', 'dQw4w9WgXcQ', '3JZ_D3ELwOQ'];
        let currentVideoIndex = 0;

        // جلب الرصيد الحالي للمستخدم
        function fetchUserCredits() {
            fetch('/api/youtube-data')
                .then(res => res.json())
                .then(data => {
                    if (!data.error) {
                        document.getElementById('userCredits').innerText = `الرصيد: ${data.user.credits} نقطة`;
                    }
                });
        }

        // تهيئة مشغل يوتيوب المخفي
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('ytplayer', {
                height: '100%',
                width: '100%',
                videoId: videosQueue[currentVideoIndex],
                playerVars: {
                    'playsinline': 1, 'controls': 0, 'disablekb': 1, 'fs': 0, 'rel': 0, 'modestbranding': 1
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            fetchUserCredits();
            updateStatus("النظام جاهز، اضغط تشغيل لبدء الأتمتة.");
        }

        function onPlayerStateChange(event) {
            if (event.data == YT.PlayerState.PLAYING && isWorking) {
                updateStatus("جاري المشاهدة อوتوماتيكياً...");
                startProgress();
            } else if (event.data == YT.PlayerState.PAUSED) {
                stopProgress();
                if(isWorking) updateStatus("تم إيقاف الفيديو مؤقتاً، يرجى الاستمرار.");
            } else if (event.data == YT.PlayerState.ENDED) {
                if (currentSeconds < targetSeconds) {
                    skipVideo(); // إذا كان الفيديو أقصر من المطلوب، تخطاه.
                }
            }
        }

        function startAutomation() {
            if (!player || !player.playVideo) return;
            isWorking = true;
            document.getElementById('btnStart').style.background = '#22c55e'; // يتحول للأخضر
            document.getElementById('btnStart').innerText = '⏸';
            document.getElementById('btnStart').onclick = pauseAutomation;
            player.playVideo();
        }

        function pauseAutomation() {
            isWorking = false;
            player.pauseVideo();
            document.getElementById('btnStart').style.background = '#ef4444';
            document.getElementById('btnStart').innerText = '▶';
            document.getElementById('btnStart').onclick = startAutomation;
        }

        function updateStatus(msg) {
            document.getElementById('statusText').innerHTML = `<div class="spinner"></div> @hydratube: ${msg}`;
        }

        // حساب التقدم وإرسال النقاط
        function startProgress() {
            stopProgress();
            watchTimer = setInterval(() => {
                if (!isWorking) return;
                currentSeconds++;
                let percent = (currentSeconds / targetSeconds) * 100;
                document.getElementById('progressFill').style.width = percent + '%';

                if (currentSeconds >= targetSeconds) {
                    stopProgress();
                    awardPoints();
                }
            }, 1000);
        }

        function stopProgress() {
            clearInterval(watchTimer);
        }

        function skipVideo() {
            stopProgress();
            currentSeconds = 0;
            document.getElementById('progressFill').style.width = '0%';
            currentVideoIndex = (currentVideoIndex + 1) % videosQueue.length;
            player.loadVideoById(videosQueue[currentVideoIndex]);
            if(isWorking) {
                updateStatus("جاري الانتقال للفيديو التالي...");
            }
        }

        // الاتصال بخادمك لمنح 0.5 نقطة بذكاء
        function awardPoints() {
            updateStatus("تمت المهمة بنجاح! جاري إضافة النقاط...");
            player.pauseVideo();
            
            fetch('/api/earn-points', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ actionType: 'auto_watch' })
            })
            .then(res => res.json())
            .then(result => {
                fetchUserCredits(); // تحديث الرصيد في الشاشة
                skipVideo(); // تشغيل الفيديو التالي تلقائياً
                if(isWorking) setTimeout(startAutomation, 1500);
            });
        }
    </script>
</body>
</html>
